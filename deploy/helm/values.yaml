replicaCount: 3

image:
  repository: ragops/api
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ragops.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ragops-tls
      hosts:
        - ragops.example.com

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

env:
  environment: "production"
  groqModel: "llama-3.1-70b-versatile"
  logLevel: "INFO"
  otelServiceName: "ragops"
  otelExporterEndpoint: "http://jaeger:4317"

persistence:
  enabled: true
  size: 20Gi
  accessMode: ReadWriteOnce
