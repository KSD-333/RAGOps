apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ragops-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - ragops.example.com
      secretName: ragops-tls
  rules:
    - host: ragops.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ragops-service
                port:
                  number: 80
