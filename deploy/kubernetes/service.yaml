apiVersion: v1
kind: Service
metadata:
  name: ragops-service
  namespace: default
  labels:
    app.kubernetes.io/name: ragops
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ragops
    app.kubernetes.io/component: api
