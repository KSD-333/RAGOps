[project]
name = "ragops"
version = "0.1.0"
description = "RAGOps — Production RAG Platform with Evaluation & Observability"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "RAGOps Team"},
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "groq>=0.11.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.6",
    "html2text>=2024.2.26",
    "tiktoken>=0.7.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0",
    "click>=8.1.0",
    "rich>=13.8.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
ragops = "ragops.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragops"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
ignore = [
    "E501",  # line too long
    "B008",  # function call in argument defaults (standard for FastAPI Depends)
    "E402",  # module level import not at top
    "B904",  # raise ... from err
    "B905",  # zip() without strict= parameter
    "W293",  # blank line whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841", "B008", "E501"]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.11"
strict = true
