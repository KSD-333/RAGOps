name: Production Deployment & Quality Gate

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write  # Enables automated pushing to GitHub Container Registry (ghcr.io)

jobs:
  # ============================================================================
  # Stage 1: Quality Gate & Test Verification
  # Blocks container deployment if tests fail or retrieval quality regresses
  # ============================================================================
  quality-gate:
    name: Automated Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"

      - name: Run Test Suite (Unit & Integration)
        run: |
          pytest tests/unit tests/integration -v --tb=short

      - name: Ingest Knowledge Base
        run: |
          python scripts/ingest_documents.py --path data/raw --version candidate

      - name: Verify Evaluation Thresholds
        if: env.GROQ_API_KEY != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/run_evaluation.py \
            --dataset evaluation/datasets/golden.jsonl \
            --version candidate \
            --output evaluation/reports/ci_deploy_gate.json \
            --fail-on-gate

  # ============================================================================
  # Stage 2: Container Build & Push to Docker Hub (ketan333) & GHCR
  # Executes only when Quality Gate passes
  # ============================================================================
  build-and-deploy:
    name: Build & Push Container (ketan333)
    needs: [quality-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (ketan333)
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'ketan333' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure Image Tags
        id: docker_tags
        shell: bash
        run: |
          TAGS="ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            TAGS="$TAGS,ketan333/ragops:latest,ketan333/ragops:${{ github.sha }}"
            echo "Pushing to Docker Hub under user ketan333 and GHCR."
          else
            echo "DOCKERHUB_TOKEN not configured; pushing to GitHub Container Registry (ghcr.io)."
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

      - name: Production Deployment Notification
        if: success()
        run: |
          echo "=========================================================="
          echo "🚀 RAGOps Production Container Deployment Succeeded!"
          echo "Docker Hub Tag: ketan333/ragops:latest (when secret set)"
          echo "GHCR Tag: ghcr.io/${{ github.repository }}:latest"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=========================================================="
